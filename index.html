<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danger's Split-Screen FPV</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }

  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; z-index: 10;
    background: #000; color: #fff;
  }
  #start button {
    font-size: 20px; padding: 14px 28px; border: none; border-radius: 12px;
    background: #ff3b3b; color: #fff; font-weight: 700;
  }
  #start p { opacity: 0.7; font-size: 14px; text-align: center; padding: 0 20px; }

  #view { position: fixed; inset: 0; display: none; }
  #view.on { display: flex; }

  .eye { flex: 1; position: relative; overflow: hidden; background: #000; }
  .eye canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hud { pointer-events: none; }

  #controls {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); color: #fff; padding: 6px 12px;
    border-radius: 10px; font-size: 12px; display: flex; gap: 10px; align-items: center;
    z-index: 5;
  }
  #controls input[type=range] { width: 110px; }
  #controls button { background: #333; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; }
</style>
</head>
<body>

<div id="start">
  <button id="startBtn">Start FPV</button>
  <p>Allow camera access. Rotate to landscape and place your phone in the goggles.</p>
</div>

<div id="view">
  <div class="eye" id="leftEye">
    <canvas id="leftCanvas"></canvas>
    <canvas class="hud" id="leftHud"></canvas>
  </div>
  <div class="eye" id="rightEye">
    <canvas id="rightCanvas"></canvas>
    <canvas class="hud" id="rightHud"></canvas>
  </div>
</div>

<div id="controls" style="display:none">
  <label>Eye gap <input type="range" id="gap" min="0" max="40" value="12"></label>
  <label>HUD <input type="checkbox" id="hudToggle" checked></label>
  <button id="flip">Flip</button>
</div>

<video id="cam" autoplay playsinline muted style="display:none"></video>

<script>
const video = document.getElementById('cam');
const view = document.getElementById('view');
const startDiv = document.getElementById('start');
const controls = document.getElementById('controls');
const gapSlider = document.getElementById('gap');
const hudToggle = document.getElementById('hudToggle');

const leftCanvas = document.getElementById('leftCanvas');
const rightCanvas = document.getElementById('rightCanvas');
const LH = document.getElementById('leftHud');
const RH = document.getElementById('rightHud');
const L = leftCanvas.getContext('2d');
const R = rightCanvas.getContext('2d');
const LHc = LH.getContext('2d');
const RHc = RH.getContext('2d');

let gap = 12;
let flipped = false;
let heading = 0;
let pitch = 0;

document.getElementById('startBtn').addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    startDiv.style.display = 'none';
    view.classList.add('on');
    controls.style.display = 'flex';
    requestOrientation();
    resize();
    requestAnimationFrame(draw);
  } catch (e) {
    alert('Camera error: ' + e.message);
  }
});

async function requestOrientation() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
  }
  window.addEventListener('deviceorientation', e => {
    heading = e.alpha ?? 0;
    pitch = e.beta ?? 0;
  });
}

function resize() {
  [leftCanvas, rightCanvas, LH, RH].forEach(c => {
    const box = c.parentElement.getBoundingClientRect();
    c.width = box.width;
    c.height = box.height;
  });
}
window.addEventListener('resize', resize);

gapSlider.addEventListener('input', () => gap = +gapSlider.value);
document.getElementById('flip').addEventListener('click', () => flipped = !flipped);
hudToggle.addEventListener('change', () => {
  LH.style.display = RH.style.display = hudToggle.checked ? 'block' : 'none';
});

function drawEye(ctx, canvas, offsetX) {
  const cw = canvas.width, ch = canvas.height;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;

  const scale = Math.max(cw / vw, ch / vh);
  const dw = vw * scale, dh = vh * scale;
  const dx = (cw - dw) / 2 + offsetX;
  const dy = (ch - dh) / 2;

  ctx.save();
  ctx.clearRect(0, 0, cw, ch);
  if (flipped) {
    ctx.translate(cw, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, cw - dw - dx, dy, dw, dh);
  } else {
    ctx.drawImage(video, dx, dy, dw, dh);
  }
  ctx.restore();
}

function drawHud(ctx, canvas) {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(0,255,120,0.9)';
  ctx.fillStyle = 'rgba(0,255,120,0.9)';
  ctx.lineWidth = 2;
  ctx.font = '14px monospace';

  const cx = w / 2, cy = h / 2;
  ctx.beginPath();
  ctx.moveTo(cx - 20, cy); ctx.lineTo(cx - 6, cy);
  ctx.moveTo(cx + 6, cy);  ctx.lineTo(cx + 20, cy);
  ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy - 6);
  ctx.moveTo(cx, cy + 6);  ctx.lineTo(cx, cy + 20);
  ctx.stroke();

  const hy = cy + pitch * 3;
  ctx.beginPath();
  ctx.moveTo(w * 0.3, hy); ctx.lineTo(w * 0.7, hy);
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillText(Math.round(heading) + '°', cx, 24);

  ctx.textAlign = 'right';
  ctx.fillText('BAT 87%', w - 12, 24);
}

function draw() {
  drawEye(L, leftCanvas, -gap);
  drawEye(R, rightCanvas, gap);
  if (hudToggle.checked) {
    drawHud(LHc, LH);
    drawHud(RHc, RH);
  }
  requestAnimationFrame(draw);
}
</script>
</body>
</html>
